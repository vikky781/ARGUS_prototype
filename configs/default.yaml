# Values below are tuned per-phase as each pipeline stage is implemented.
# geoip_mmdb_path is still an unused placeholder — this repo's ingestion enrichment
# is fully offline/synthetic (see src/argus/ingest/geoip.py), no real database used.

random_seed: 42
num_entities: 2000
num_wallets: 50000
num_transactions: 200000
ip_noise: 0.05
heuristic_break_rate: 0.1
mixer_fraction: 0.02
geoip_mmdb_path: null
